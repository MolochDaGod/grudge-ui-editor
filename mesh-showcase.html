<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grudge Mesh Equipment Showcase</title>
  <meta name="description" content="All Toon RTS races · every modular mesh · definition UUID · mesh_id equip on unarmed base" />
  <link rel="stylesheet" href="./grudge-fonts.css" />
  <link rel="stylesheet" href="./main-panel.css" />
  <style>
    .ms-root{min-height:100vh;background:#0a0705;color:#f5e2c1;font-family:Crimson Text,Georgia,serif}
    .ms-top{padding:10px 14px;border-bottom:2px solid #c9950a;background:linear-gradient(90deg,#1a100a,#221710)}
    .ms-top h1{font-family:Cinzel,serif;font-size:15px;letter-spacing:.18em;color:#d4a400;margin:0}
    .ms-top .sub{font-size:11px;color:#9b7d52}
    .ms-idbar{display:flex;flex-wrap:wrap;gap:12px 18px;padding:8px 14px;font-size:11px;border-bottom:1px solid #3a2a1a;background:#120c08}
    .ms-idbar .k{color:#9b7d52;margin-right:6px;text-transform:uppercase;letter-spacing:.06em;font-size:9px}
    .ms-idbar code{font-family:ui-monospace,JetBrains Mono,monospace;font-size:10px;color:#fde68a}
    .ms-races,.ms-groups{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px}
    .ms-race,.ms-grp{background:#1a120c;border:1px solid #5b3a1c;color:#f5e2c1;padding:6px 10px;border-radius:4px;cursor:pointer;font-family:Cinzel,serif;font-size:11px;letter-spacing:.08em}
    .ms-race.on,.ms-grp.on{border-color:#fbbf24;color:#fde68a;background:#3a2a1a}
    .ms-race small,.ms-grp small{color:#9b7d52;margin-left:6px}
    .ms-body{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:10px;padding:10px 14px;align-items:start}
    .ms-stage{border:2px solid #6b1d12;border-radius:4px;background:#0c0906;min-height:420px;position:relative}
    #ms-viewport{position:relative;min-height:420px;height:52vh}
    #ms-viewport .g6-viewport{position:absolute;inset:0;min-height:0;height:100%;margin:0;border:0;background:transparent}
    .ms-detail{padding:10px;font-size:12px;border-top:1px solid #3a2a1a}
    .ms-detail h3{font-family:Cinzel,serif;letter-spacing:.1em;margin:0 0 8px;color:#fde68a}
    .ms-detail .k{color:#9b7d52;text-transform:uppercase;font-size:9px;letter-spacing:.08em;margin-right:6px}
    .ms-ids{font-size:10px;color:#c4b5a0;max-height:120px;overflow:auto;background:#080604;padding:8px}
    .ms-grid-wrap h2{font-family:Cinzel,serif;font-size:12px;letter-spacing:.14em;color:#e7e5e4;margin:0 0 6px}
    .ms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
    .ms-card{text-align:left;background:#1a120c;border:1px solid #4a2f16;border-radius:4px;padding:8px;cursor:pointer;color:#f5e2c1;display:flex;flex-direction:column;gap:4px}
    .ms-card:hover{border-color:#fbbf24}
    .ms-card.on{border-color:#fbbf24;background:#3a2a1a}
    .ms-card.base{outline:1px dashed rgba(34,197,94,.45);outline-offset:1px}
    .ms-g{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#ca8a04}
    .ms-n{font-size:13px}
    .ms-mid,.ms-uid{font-size:9px;word-break:break-all;color:#c4b5a0}
    .ms-uid{color:#86efac}
    .ms-links{padding:8px 14px;font-size:11px}
    .ms-links a{color:#fbbf24;margin-right:12px}
    @media(max-width:900px){.ms-body{grid-template-columns:1fr}}
  </style>
  <script src="./grudge-cloud-save.js"></script>
  <script src="./warlords-character-ssot.js"></script>
  <script src="./grudge6-viewport.js"></script>
  <script src="./grudge-engine.js"></script>
  <script src="./mesh-showcase.js"></script>
</head>
<body class="ms-root mp-root">
  <header class="ms-top">
    <h1>TRAIT STORE · MESH EQUIPMENT</h1>
    <div class="sub">trait.grudge.studio · sha1(grudge-asset:kit#meshId) · all races · modular kit · unarmed base locked</div>
  </header>
  <div class="ms-idbar" id="ms-idbar">Loading catalog…</div>
  <nav class="ms-races" id="ms-races"></nav>
  <nav class="ms-groups" id="ms-groups"></nav>
  <div class="ms-body">
    <div class="ms-stage">
      <div id="ms-viewport" class="eq-portrait-wrap"></div>
      <div class="ms-detail" id="ms-detail"></div>
    </div>
    <div class="ms-grid-wrap">
      <h2 id="ms-grid-meta">Items</h2>
      <div class="ms-grid" id="ms-grid"></div>
    </div>
  </div>
  <p class="ms-links">
    <a href="./main-panel.html?era=warlords&tab=equipment">Main Panel equipment</a>
    <a href="./GRUDGE6_Characters.html">grudge6 mesh lab</a>
    <a href="./data/mesh-showcase-index.json">index JSON</a>
    <a href="https://open.grudge-studio.com/equipment">Open character</a>
  </p>
  <script>
    (async function () {
      try {
        const era = new URLSearchParams(location.search).get("era") || "warlords";
        if (window.GrudgeEngine?.init) await GrudgeEngine.init({ era }).catch(() => {});
        await MeshShowcase.boot();
      } catch (e) {
        document.getElementById("ms-idbar").textContent = "Showcase failed: " + (e.message || e);
      }
    })();
  </script>
</body>
</html>
